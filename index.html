<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DYO — Se deschide oferta</title>
  <style>
    :root{--ink:#40352f;--gold:#b8a172;--cream:#f8f5ef;--line:#d8ccb4}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--cream)}
    body{display:grid;place-items:center;padding:24px;overflow:hidden}
    main{width:min(92vw,520px);min-height:min(84vh,680px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px 28px;border:1px solid var(--line);background:rgba(255,255,255,.68);box-shadow:0 18px 60px rgba(64,53,47,.08);position:relative;overflow:hidden}
    main:before,main:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(184,161,114,.32);border-radius:50%}
    main:before{top:-120px;left:-90px}main:after{bottom:-120px;right:-90px}
    .mark{width:116px;height:116px;object-fit:contain;opacity:.88;margin-bottom:22px;animation:softIn .7s ease both}
    .eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#958467;margin:0 0 20px;animation:softIn .7s .1s ease both}
    h1{font-size:clamp(27px,7vw,42px);font-weight:400;line-height:1.12;margin:0 0 14px;animation:softIn .7s .18s ease both}
    p{font-size:15px;line-height:1.7;color:#796d61;margin:0;animation:softIn .7s .26s ease both}
    .loader{width:104px;height:2px;background:#e4dccd;margin:34px 0 20px;overflow:hidden;position:relative}
    .loader span{display:block;width:38%;height:100%;background:var(--gold);animation:load 900ms ease-in-out infinite}
    .fallback{font-size:12px;color:#998c7b;opacity:.8}
    .fallback a{color:inherit;text-underline-offset:3px}
    @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
    @keyframes softIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <img class="mark" src="https://dyo-endlessmemories.github.io/DYO/assets/images/logo.png" alt="DYO Endless Memories">
    <p class="eyebrow">DYO · Endless Memories</p>
    <h1>Se deschide oferta…</h1>
    <p>Te redirecționăm către pagina pregătită pentru tine.</p>
    <div class="loader" aria-hidden="true"><span></span></div>
    <p class="fallback">Dacă pagina nu se deschide automat, <a id="open" href="#">apasă aici</a>.</p>
  </main>
  <script>
    (()=>{
      const fallback='https://dyo-endlessmemories.github.io/DYO/albume-absolventi.html';
      const params=new URLSearchParams(location.search);
      const target=params.get('url')||params.get('u')||fallback;
      let destination=fallback;
      try{
        const parsed=new URL(target,location.href);
        if(parsed.protocol==='https:'||parsed.protocol==='http:') destination=parsed.href;
      }catch(e){}
      document.getElementById('open').href=destination;
      setTimeout(()=>{ location.replace(destination); },900);
    })();
  </script>
</body>
</html>
